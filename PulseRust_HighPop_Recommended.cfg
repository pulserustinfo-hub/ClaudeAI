# =====================================================================
# PulseRust high-pop performance baseline - researched 5 Nov 2026
# See PulseRust_HighPop_ConvarGuide.pdf for the reasoning behind each line.
# Merge into server/<identity>/cfg/server.cfg (server.cfg loads AFTER
# serverauto.cfg, so values here win). Rust skips a line only when its
# FIRST character is '#': never put a comment after a value.
# =====================================================================
#
# --- Threading -------------------------------------------------------
# Leave server.useplayerupdatejobs UNSET so you follow Facepunch's
# default (4 from the 5 Nov 2026 patch, per commit #170103). Check it in
# the console after patching; if it still reads 3, test 4 on staging.
server.emergencydisableplayerjobs true
#
# --- Frame cap and tick (defaults; overrides "performance" myths) ----
fps.limit 240
server.tickrate 10
#
# --- Saves -----------------------------------------------------------
# Raise to 900 only if the log's "Saved N ents ... write(y), disk(z)"
# shows write+disk above ~0.5 s late in the wipe.
server.saveinterval 600
server.saveframebudget 5
#
# --- Decay: never slow decay for performance ------------------------
decay.scale 1
decay.upkeep true
#
# --- Animals: ~50% of 2026 defaults (AI is already frame-budgeted) --
bear.population 1
polarbear.population 0.5
wolf.population 1
boar.population 2.5
stag.population 1.5
chicken.population 1.5
ridablehorse.population 1
tiger.population 0.25
panther.population 0.25
crocodile.population 0.5
#
# --- Dropped items and abandoned vehicles (gameplay trade-off) ------
server.itemdespawn 240
bike.outsidedecayminutes 480
snowmobile.outsidedecayminutes 480
modularcar.outsidedecayminutes 480
modularcar.population 2
#
# --- AI ----------------------------------------------------------------
aimanager.ai_dormant true
ai.npc_max_junkpile_count 20
#
# --- TEST ON STAGING FIRST: remove the leading '#' one line at a time -
#physics.droppedmode 3
#ai.nav_carve_use_building_optimization true
#aimanager.nav_obstacles_carve_state 1
#aithinkmanager.animalframebudgetms 1.5
#server.maxitemstacksmovedpertickindustrial 8
# Launch argument (not a convar) to trial on staging: -useNewNavmesh
#
# --- DELETE from server.cfg / serverauto.cfg / launch scripts if present
# gc.buffer, gc.interval, physics.steps, physics.minsteps,
# global.asyncwarmup, global.preloadconcurrency, global.warmupconcurrency,
# batching.colliders, nav_disable, autoturret.auto_turret_budget_ms,
# sleepers.on, truth.enforce, cheaters.log, server.maxticketspersecond,
# server.clienttimeout, server.globalchat, server.useplayerupdatejobs 0/1/2
